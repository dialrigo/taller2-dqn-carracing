[project]
name = "carracing-dqn"
version = "1.0.0"
description = "Taller 2 - Agente Deep Q-Network (Double DQN) para CarRacing-v3 de Gymnasium desde píxeles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium[box2d]>=1.0",
    "torch>=2.2",
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "mlflow>=2.10",
    "imageio>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carracing_dqn"]
